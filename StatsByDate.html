async function loadTeamLogos(){
 await Promise.all(['NHL','AHL'].map(async lg=>{
  try{
   const response=await fetch(CONFIG.teamsPath+lg+'_Teams.txt',{cache:'no-store'});
   if(!response.ok)return;
   const text=await response.text();
   for(const line of text.split(/\r?\n/)){
    const parts=line.trim().split(';');
    if(parts.length<3)continue;
    const short=parts[0].trim(),full=parts[1].trim(),file=parts[2].trim();
    if(full&&file&&!file.includes('/')&&!file.includes('\\')&&!file.includes('..')){
      teamLogos.set(lg+':'+norm(full),file);
      if(short)teamLogos.set(lg+':'+norm(short),file);
    }
   }
  }catch(e){console.warn('Lagregister saknas:',lg,e)}
 }));
 render();
}
function teamLogo(lg,team,code=''){

 if(!filename&&lg==='NHL'){
  const n=norm(team),c=norm(code);
  const key=NHL_ABBREV[c]||NHL_ABBREV[n]||NHL_CITY_CODES[n];
  if(key)filename=teamLogos.get('NHL:'+key);
 }
 if(!filename&&lg==='NHL'&&norm(team)==='newyork'){
  console.warn('NHL-logotyp: New York kräver lagkod NYR eller NYI');
 }

}

function isOngoing(g){

function gamePhase(g){

 const status=get(g,'Status','GameStatus','gameState','game_status').toUpperCase();

    const goalPeriods=goalGame(g).map(x=>({period:num(get(x,'Period','PeriodNumber')),type:get(x,'PeriodType','PeriodName','GoalType').toUpperCase()}));

    if(goalPeriods.some(x=>/\bOT\b|OVERTIME/.test(x.type)||x.period===4))return 'OT';
    const periods=raw?.periods||raw?.game?.periods||[];
    if(Array.isArray(periods)){
      if(periods.some(x=>/SO|SHOOTOUT/i.test(String(x.periodType||x.name||x.label||''))))return 'GWS';
      if(periods.some(x=>/OT|OVERTIME/i.test(String(x.periodType||x.name||x.label||''))||Number(x.periodNumber||x.number||0)===4 && (x.goals||[]).length))return 'OT';
    }
  }
  return '';
}
function goalSort(a,b){const ap=num(get(a,'Period','PeriodNumber')),bp=num(get(b,'Period','PeriodNumber'));if(ap!==bp)return ap-bp;const t=r=>{const v=get(r,'Time','PeriodTime','TimeInPeriod');const parts=v.split(':').map(Number);return parts.length===2?parts[0]*60+parts[1]:0};return t(a)-t(b)}
const LOCALSPORT_PLAY_ICON='icons/localsport_play_symbol.svg';
function videoButton(url,title){
 if(!/^https:\/\/(?:www\.)?nhl\.com\/video\/[a-z0-9-]+$/i.test(String(url||'')))return '';
 return `<button class="goal-video" type="button" data-video-url="${escapeHtml(url)}" data-video-title="${escapeHtml(title||'Målvideo')}" aria-label="Spela målvideo" title="Spela målvideo"><img src="${LOCALSPORT_PLAY_ICON}" alt="▶" onerror="this.style.display='none';this.parentNode.textContent='▶'"></button>`;
}
function goalRow(abbr,time,score,desc,videoUrl=''){
 const lines=String(desc||'–').split('\u001f');
 const description=lines.map((line,i)=>`<span class="goal-person${i?' goal-assist':''}">${epLinkLine(line)}</span>`).join('');
 return `<div class="goal"><span class="goal-time">${escapeHtml(time||'–')}</span><span class="abbr">${escapeHtml(abbr||'–')}</span><span class="score">${escapeHtml(score||'–')}</span><span class="goal-play">${videoButton(videoUrl,`${abbr} ${time} ${score}`)}</span><span class="goal-desc">${description}</span></div>`;
}
function shootoutDetails(g){
 const attempts=shootoutGame(g);
 if(!attempts.length)return '';
 let html='<div class="periodheading">SO / Straffläggning</div>';
 for(const r of attempts){
  const number=get(r,'JerseyNumber'),name=get(r,'Player')||('Spelare '+get(r,'PlayerID'));
  const label=(number?number+'. ':'')+name;
  const result=get(r,'Result').toLowerCase()==='scored'?'Scored':'Missed';
  html+=goalRow(get(r,'TeamCode','Team'),get(r,'Attempt'),'',label+' — '+result);
 }
 // Sista raden: matchavgörande straff som en vanlig målrad, med GWS i tidskolumnen.
 // Lägg bara till när matchen är avslutad och straffläggningen har en vinnare.
 const homeCode=get(g,'HomeCode','HomeAbbrev'),awayCode=get(g,'AwayCode','AwayAbbrev');
 const home=attempts.filter(r=>get(r,'TeamCode')===homeCode&&get(r,'Result').toLowerCase()==='scored').length;
 const away=attempts.filter(r=>get(r,'TeamCode')===awayCode&&get(r,'Result').toLowerCase()==='scored').length;
 const status=get(g,'Status','GameStatus','GameState').toUpperCase();
 const complete=/^(OFF|FINAL|FINAL_OT|FINAL_SO|FINISHED|COMPLETED)$/.test(status)||outcome(g)==='GWS'&&/^(OFF|FINAL)/.test(status);
 if(complete&&home!==away){
  const winnerCode=home>away?homeCode:awayCode;
  const winningGoals=Math.min(home,away)+1;
  const winningAttempt=attempts.filter(r=>get(r,'TeamCode')===winnerCode&&get(r,'Result').toLowerCase()==='scored')[winningGoals-1];
  if(winningAttempt){
   const number=get(winningAttempt,'JerseyNumber'),name=get(winningAttempt,'Player');
   const label=(number?number+'. ':'')+name;
   const score=scoreHome(g)+'–'+scoreAway(g);
   html+=goalRow(winnerCode,'GWS',score,label);
  }
 }
 return html;
}
function gameGoalDetails(g,cached){
 const shootout=shootoutDetails(g);
 if(cached?.plays){
  // Visa endast ordinarie mål och OT-mål från NHL:s play-by-play.
  // Straffläggningen kommer separat från Shootout CSV (inklusive missar).
  return rawGoalDetails(g,cached)+shootout;
 }
 return goalDetailsCsv(g)+shootout;
}
function goalDetailsCsv(g){
 const goals=goalGame(g).filter(r=>!(/SO|GWS/i.test(get(r,'PeriodType'))||num(get(r,'Period'))>=5)).slice().sort(goalSort);
 if(!goals.length)return shootoutGame(g).length?'':'<div class="secondary">Målhändelser saknas eller kan ännu inte matchas mot denna match.</div>';
 let lastPeriod='',html='',home=0,away=0;
 const homeAliases=[get(g,'HomeCode','HomeAbbrev'),teamHome(g)].map(norm).filter(Boolean);
 const awayAliases=[get(g,'AwayCode','AwayAbbrev'),teamAway(g)].map(norm).filter(Boolean);
 for(const r of goals){
  const period=get(r,'Period','PeriodNumber'),periodType=get(r,'PeriodType'),title=/SO|GWS/i.test(periodType)?'SO':/OT/i.test(periodType)||Number(period)===4?'OT':period?`Period ${period}`:'Målhändelser';
  if(title!==lastPeriod){html+=`<div class="periodheading">${escapeHtml(title)}</div>`;lastPeriod=title}
  const abbr=get(r,'ScoringTeamAbbrev','TeamCode','TeamAbbrev','Team','ScoringTeam');
  const explicitHome=get(r,'HomeScore','HomeGoals','HomeScoreAfterGoal'),explicitAway=get(r,'AwayScore','AwayGoals','AwayScoreAfterGoal');
  let score='';
  if(explicitHome!==''&&explicitAway!==''){
    home=num(explicitHome);away=num(explicitAway);score=`${home}–${away}`;
  }else{
    const alias=norm(abbr);
    const isHome=homeAliases.includes(alias),isAway=awayAliases.includes(alias);
    const isShootout=title==='SO';
    if(!isShootout&&isHome!==isAway){if(isHome)home++;else away++;score=`${home}–${away}`}
    else if(!isShootout){
      const direct=get(r,'ScoreAfterGoal','GameScore','Score');
      const m=direct.match(/^(\d+)\s*[-–:]\s*(\d+)$/);
      if(m){home=Number(m[1]);away=Number(m[2]);score=`${home}–${away}`}
    }
  }
  html+=goalRow(abbr,get(r,'Time','PeriodTime','TimeInPeriod'),score||'–',goalText(r),get(r,'VideoURL'));
 }
 return html;
}
function playerLabel(id,roster){const p=roster.get(String(id));if(!p)return id?`Spelare ${id}`:'';const name=[p.firstName?.default||p.firstName,p.lastName?.default||p.lastName].filter(Boolean).join(' ');const n=p.sweaterNumber??p.jerseyNumber;return `${n!=null&&String(n)!==''?n+'. ':''}${name}`}
// NHL situationCode: [hemmamålvakt, hemmautespelare, bortautespelare, bortamålvakt].
// Visa ENG vid mål i tom bur; annars 6on5/6on4 när målskyttens lag
// har plockat ut målvakten. Övriga mål får EQ/PP/SH.
function nhlGoalStrength(goal,isHome){
  const d=goal.details||{}, code=String(goal.situationCode||'');
  if(goal.periodDescriptor?.periodType==='SO')return 'SO';
  const valid=/^[01][0-6][0-6][01]$/.test(code);
  const ownGoalie=valid?code[isHome?0:3]:null;
  const oppGoalie=valid?code[isHome?3:0]:null;
  const own=valid?Number(code[isHome?1:2]):null;
  const opp=valid?Number(code[isHome?2:1]):null;
  const flaggedENG=d.emptyNet===true||d.emptyNet===1||String(d.emptyNet).toLowerCase()==='true';
  if(flaggedENG||(valid&&oppGoalie==='0'))return 'ENG';
  if(!valid)return '';
  if(ownGoalie==='0')return `${own}on${opp}`;
  const diff=own-opp;
  return diff===0?'EQ':diff>0?'PP'+diff:'SH'+(-diff);
}
function rawGoalDetails(g,obj){if(!obj?.plays)return goalDetailsCsv(g);const box=rawCache.get(rawPath(g,'boxscore'));const roster=new Map([...(box?.rosterSpots||[]),...(obj.rosterSpots||[])].map(p=>[String(p.playerId),p]));const homeId=String(obj.homeTeam?.id||''),homeCode=obj.homeTeam?.abbrev||get(g,'HomeCode'),awayCode=obj.awayTeam?.abbrev||get(g,'AwayCode');const goals=obj.plays.filter(x=>x.typeDescKey==='goal'&&x.details&&x.periodDescriptor?.periodType!=='SO').sort((a,b)=>(a.periodDescriptor?.number||0)-(b.periodDescriptor?.number||0)||num(a.sortOrder)-num(b.sortOrder));if(!goals.length)return goalDetailsCsv(g);let html='',last='';for(const goal of goals){const d=goal.details,period=goal.periodDescriptor||{},title=period.periodType==='OT'?'OT':period.periodType==='SO'?'SO':`Period ${period.number}`;if(title!==last){html+=`<div class="periodheading">${escapeHtml(title)}</div>`;last=title}const abbr=String(d.eventOwnerTeamId)===homeId?homeCode:awayCode,scorer=playerLabel(d.scoringPlayerId,roster),season=d.scoringPlayerTotal!=null?` (${d.scoringPlayerTotal})`:'',assists=[1,2].map(n=>d[`assist${n}PlayerId`]?`${playerLabel(d[`assist${n}PlayerId`],roster)}${d[`assist${n}PlayerTotal`]!=null?` (${d[`assist${n}PlayerTotal`]})`:''}`:'').filter(Boolean);const strength=nhlGoalStrength(goal,String(d.eventOwnerTeamId)===homeId);const strengthLabel=strength?' ['+strength+']':'';const score=d.homeScore!=null&&d.awayScore!=null?`${d.homeScore}–${d.awayScore}`:'';const clip=goalGame(g).find(r=>String(get(r,'Period'))===String(period.number)&&get(r,'Time')===goal.timeInPeriod&&String(get(r,'ScorerID'))===String(d.scoringPlayerId));html+=goalRow(abbr,goal.timeInPeriod,score,[`${scorer}${season}${strengthLabel}`,...assists].join('\u001f'),clip?get(clip,'VideoURL'):'')}return html}
function matchTimestamp(g){const t=gameTime(g);const iso=Date.parse(t);if(Number.isFinite(iso))return iso;const time=t.match(/(\d{1,2}):(\d{2})/);return time?Number(time[1])*60+Number(time[2]):Number.MAX_SAFE_INTEGER}
function timeSweden(g){const t=gameTime(g);const parsed=Date.parse(t);if(Number.isFinite(parsed))return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Stockholm',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(parsed));return t.match(/\b\d{1,2}:\d{2}\b/)?.[0]||'–'}
function renderGames(){

 });

async function hydrateOutcomes(games,token){await Promise.all(games.map(g=>fetchRaw(g,leagueOf(g)==='AHL'?'gameSummary':'boxscore')));if(token===loadToken)render()}

// v24: uppdatera kolumnbredder efter faktisk layout, utan sidomladdning.
let matchLayoutFrame=0;

function updateMatchLayout(){
 const table=document.querySelector('.games-table');
 if(!table)return;
 const homeNames=[...table.querySelectorAll('.matchrow .compact-home .compact-team-name')];

  const canvas=updateMatchLayout.canvas||(updateMatchLayout.canvas=document.createElement('canvas'));
  const ctx=canvas.getContext('2d');
  const style=getComputedStyle(el);

  return ctx.measureText(el.textContent||'').width;
 };

function move(days){const candidate=new Date(selected.getFullYear(),selected.getMonth(),selected.getDate()+days,12);selected=candidate;const u=new URL(location.href);u.searchParams.set('date',dateKey(selected));history.replaceState(null,'',u);load()}

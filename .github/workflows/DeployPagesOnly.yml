name: DeployPagesOnly

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p _site
          cp SeriesAndTeams.html _site/SeriesAndTeams.html

          if [[ -f index.html ]]; then
            cp index.html _site/index.html
          fi

          if [[ -d icons ]]; then
            mkdir -p _site/icons
            cp -R icons/. _site/icons/
          fi

          if [[ -d logos ]]; then
            cp -R logos _site/logos
          fi

          if [[ -f LocalSports.html ]]; then
            cp LocalSports.html _site/LocalSports.html
          fi

      - name: Include StatsByDate in Pages
        shell: bash
        run: |
          set -e

          mkdir -p _site/statsByDate/data

          cp StatsByDate.html _site/StatsByDate.html

          for folder in games playerstats ep raw/games; do
            if [ -d "statsByDate/data/$folder" ]; then
              mkdir -p "_site/statsByDate/data/$folder"
              cp -R "statsByDate/data/$folder/." \
                    "_site/statsByDate/data/$folder/"
            fi
          done

          mkdir -p _site/highlights
          for file in NHL_Teams.txt AHL_Teams.txt; do
            if [ -f "highlights/$file" ]; then
              cp "highlights/$file" "_site/highlights/$file"
            fi
          done

          echo "StatsByDate publication contents:"
          find _site/statsByDate -type f | sort    
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: StatsByDate automatic updates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "regular or daily"
        required: true
        type: choice
        options:
          - regular
          - daily

permissions:
  contents: write

concurrency:
  group: statsbydate-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.schedule.outputs.mode }}
    steps:
      - name: Decide run mode in Swedish time
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Stockholm"))
          event = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          requested = os.environ.get("INPUT_MODE", "")
          mode = ""

          if event == "workflow_dispatch":
              mode = requested or "regular"
          elif event == "schedule":
              if schedule == "50 2,3 * * *":
                  if now.hour == 4:
                      mode = "daily"
              elif schedule == "0,30 * * * *":
                  if now.hour >= 19 or now.hour < 10:
                      mode = "regular"
              elif schedule == "10,20,40,50 3-8 * * *":
                  if 5 <= now.hour < 10:
                      mode = "regular"

          print(
              f"Swedish time: {now:%Y-%m-%d %H:%M %Z}; "
              f"schedule: {schedule}; mode: {mode or 'skip'}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"mode={mode}", file=output)
          PY

      - uses: actions/checkout@v4
        if: steps.schedule.outputs.mode != ''
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        if: steps.schedule.outputs.mode != ''
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.schedule.outputs.mode != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f statsByDate/requirements.txt ]; then
            python -m pip install -r statsByDate/requirements.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests pandas beautifulsoup4
          fi
          python -m pip install requests beautifulsoup4

      - name: Record update start
        if: steps.schedule.outputs.mode != ''
        run: echo "STATS_RUN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Fetch schedules and statistics
        if: steps.schedule.outputs.mode != ''
        run: |
          python statsByDate/scripts/updateHockeyDaily.py --mode regular --managed-recovery
          if [ "${{ steps.schedule.outputs.mode }}" = daily ]; then
            python statsByDate/scripts/updateHockeyDaily.py --mode daily
          fi

      - name: Fetch NHL 5-minute recaps
        if: steps.schedule.outputs.mode != ''
        run: python statsByDate/scripts/getNHLGameRecaps.py

      - name: Fetch NHL 10-minute condensed games
        if: steps.schedule.outputs.mode != ''
        run: python statsByDate/scripts/getNHLCondensedGames.py

      - name: Validate game quality
        if: steps.schedule.outputs.mode != ''
        run: python statsByDate/scripts/validateGameQuality.py --recent --production

      # The quality report above is the input to the recovery decision.
      # Production recovery catches per-game API failures and preserves its
      # cooldown state in data/quality/recovery_state.json.
      - name: Recover incomplete NHL and AHL statistics
        if: steps.schedule.outputs.mode != ''
        run: python statsByDate/scripts/recoverGameStats.py --production

      - name: Recover missing NHL goal videos
        if: steps.schedule.outputs.mode != ''
        run: python statsByDate/scripts/recoverNHLGoalVideos.py --production

      - name: Revalidate quality after recovery
        if: steps.schedule.outputs.mode != ''
        run: python statsByDate/scripts/validateGameQuality.py --recent --production

      - name: Generate dynamic schedule
        if: steps.schedule.outputs.mode != ''
        run: |
          python statsByDate/scripts/generateUpdateSchedule.py --run-start "$STATS_RUN_START" || {
            echo "::warning::Dynamic schedule generation failed; publishing statistics with expired schedule"
            printf '{"schemaVersion":0}\n' > statsByDate/data/updateSchedule.json
          }

      - name: Commit and push rolling data
        if: steps.schedule.outputs.mode != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python statsByDate/scripts/publishStatsByDate.py --mode "${{ steps.schedule.outputs.mode }}" --commit --push

  deploy:
    name: Deploy updated StatsByDate
    needs: update
    if: ${{ needs.update.result == 'success' && needs.update.outputs.mode != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/DeployPagesOnly.yml

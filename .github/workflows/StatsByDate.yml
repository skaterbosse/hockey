name: StatsByDate automatic updates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "regular or daily"
        required: true
        type: choice
        options:
          - regular
          - daily
  schedule:
    # UTC triggers; the gate below uses Europe/Stockholm to handle DST.
    # Regular: 19:00-04:59 Swedish time twice/hour; 05:00-09:59 six/hour.
    # UTC windows cover both CET and CEST; local-time gate below filters extras.
    - cron: '0,30 0-2,17-23 * * *'
    - cron: '0,10,20,30,40,50 3-8 * * *'
    - cron: '50 2,3 * * *'

permissions:
  contents: write

concurrency:
  group: statsbydate-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.schedule.outputs.mode }}
    steps:
      - name: Decide run mode in Swedish time
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Stockholm"))
          event = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          requested = os.environ.get("INPUT_MODE", "")

          mode = ""

          if event == "workflow_dispatch":
              mode = requested or "regular"

          elif event == "schedule":
              if schedule == "50 2,3 * * *":
                  # En daglig körning omkring 04:50 svensk tid.
                  # UTC-timmen varierar med sommar-/vintertid.
                  if now.hour == 4:
                      mode = "daily"

              elif schedule in (
                  "0,30 0-2,17-23 * * *",
                  "0,10,20,30,40,50 3-8 * * *",
              ):
                  # All intervals are evaluated in Swedish local time.
                  # A 10-minute UTC trigger can occur during the local 04:00 hour
                  # in winter; accept only the 00/30 slots there.
                  if 5 <= now.hour < 10:
                      mode = "regular"
                  elif now.hour >= 19 or now.hour < 5:
                      if now.minute // 10 in (0, 3):
                          mode = "regular"

          print(
              f"Swedish time: {now:%Y-%m-%d %H:%M %Z}; "
              f"schedule: {schedule}; mode: {mode or 'skip'}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"mode={mode}", file=output)
          PY

      - uses: actions/checkout@v4
        if: steps.schedule.outputs.mode != ''
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        if: steps.schedule.outputs.mode != ''
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.schedule.outputs.mode != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f statsByDate/requirements.txt ]; then
            python -m pip install -r statsByDate/requirements.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests pandas beautifulsoup4
          fi

      - name: Fetch schedules and statistics
        if: steps.schedule.outputs.mode != ''
        run: python statsByDate/scripts/updateHockeyDaily.py --mode "${{ steps.schedule.outputs.mode }}" --refresh-stats

      - name: Commit and push rolling data
        if: steps.schedule.outputs.mode != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python statsByDate/scripts/publishStatsByDate.py --mode "${{ steps.schedule.outputs.mode }}" --commit --push

  deploy:
    name: Deploy updated StatsByDate
    needs: update
    if: ${{ needs.update.result == 'success' && needs.update.outputs.mode != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/DeployPagesOnly.yml

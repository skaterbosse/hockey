name: StatsByDate automatic updates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "regular or daily"
        required: true
        type: choice
        options:
          - regular
          - daily
  schedule:
    # Swedish local time (CET/CEST), with minutes away from :00.
    # Regular: 19:07-04:37, every 30 minutes.
    - cron: '7,37 19-23,0-4 * * *'
      timezone: Europe/Stockholm
    # Regular: 05:07-09:57, every 10 minutes.
    - cron: '7,17,27,37,47,57 5-9 * * *'
      timezone: Europe/Stockholm
    # Daily: refresh future schedules at 04:49.
    - cron: '49 4 * * *'
      timezone: Europe/Stockholm

permissions:
  contents: write

# One complete fetch -> git push -> Pages deployment at a time.
# Queue all runs so a pending daily run is never replaced by regular.
# GitHub's queue limit is 100; GitHub may also drop cron triggers before queueing.
concurrency:
  group: statsbydate-publish
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.schedule.outputs.mode }}
    steps:
      - name: Select mode from triggering schedule (not actual start time)
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          schedule = os.environ.get('EVENT_SCHEDULE', '')
          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              mode = os.environ.get('INPUT_MODE') or 'regular'
          elif schedule == '49 4 * * *':
              mode = 'daily'
          else:
              mode = 'regular'
          now = datetime.now(ZoneInfo('Europe/Stockholm'))
          print(f'Swedish time: {now:%Y-%m-%d %H:%M %Z}; schedule: {schedule}; mode: {mode}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'mode={mode}', file=output)
          PY

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f statsByDate/requirements.txt ]; then
            python -m pip install -r statsByDate/requirements.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests pandas beautifulsoup4
          fi

      - name: Fetch schedules and statistics
        shell: bash
        run: |
          mode="${{ steps.schedule.outputs.mode }}"
          if [ "$mode" = "regular" ]; then
            python statsByDate/scripts/updateHockeyDaily.py --mode "$mode" --refresh-stats
          else
            python statsByDate/scripts/updateHockeyDaily.py --mode "$mode"
          fi

      - name: Commit and push rolling data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python statsByDate/scripts/publishStatsByDate.py --mode "${{ steps.schedule.outputs.mode }}" --commit --push

  deploy:
    name: Deploy updated StatsByDate
    needs: update
    if: ${{ needs.update.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/DeployPagesOnly.yml
